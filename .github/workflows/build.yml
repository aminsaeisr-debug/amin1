name: seed-mas • Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

permissions:
  contents: read

# A manual release build must not be cancelled by a push build on the same ref.
concurrency:
  group: seed-mas-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests + release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify project structure and secrets are absent
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -f settings.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/srooyesh/seedcounter/MainActivity.kt
          test -f app/src/main/java/com/srooyesh/seedcounter/CameraActivity.kt
          test -f app/src/main/java/com/srooyesh/seedcounter/NumberRecognitionEngine.kt
          test "$(find app/src/main/res/values -maxdepth 1 -name 'styles.xml' | wc -l)" -eq 1
          test -z "$(find . -type f \( -name '*.jks' -o -name '*.b64' -o -name '*.keystore' -o -name '*.p12' \) -print -quit)"
          test -z "$(find . -type f \( -name '*.bat' -o -name '*.cmd' -o -name '*.ps1' \) -print -quit)"
          test ! -f .github/workflows/generate-keystore.yml
          ./gradlew --version

      - name: Unit tests
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SEED_MAS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SEED_MAS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEED_MAS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SEED_MAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release build requires signing secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/seed-mas-release.keystore"
          chmod 600 "$RUNNER_TEMP/seed-mas-release.keystore"
          echo "SEED_MAS_KEYSTORE_PATH=$RUNNER_TEMP/seed-mas-release.keystore" >> "$GITHUB_ENV"
          echo "SEED_MAS_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_MAS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SEED_MAS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          [[ -n "$APKSIGNER" ]]
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Package release APK for publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          [[ -n "$VERSION_NAME" ]]
          rm -rf prebuilt
          mkdir -p prebuilt
          cp app/build/outputs/apk/release/app-release.apk "prebuilt/seed-mas-${VERSION_NAME}.apk"

      - name: Upload prebuilt release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-release
          path: prebuilt/*.apk
          if-no-files-found: error
          retention-days: 1

  connected-tests:
    name: Instrumented tests + debug APK
    if: ${{ github.event_name == 'push' || inputs.variant == 'debug' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Package debug APK for publication
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          [[ -n "$VERSION_NAME" ]]
          test -s app/build/outputs/apk/debug/app-debug.apk
          rm -rf prebuilt
          mkdir -p prebuilt
          cp app/build/outputs/apk/debug/app-debug.apk "prebuilt/seed-mas-${VERSION_NAME}-debug.apk"

      - name: Upload prebuilt debug APK
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-debug
          path: prebuilt/*.apk
          if-no-files-found: error
          retention-days: 1

  dependency-submission:
    name: Dependency graph
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6

  publish-release:
    name: Publish verified release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download prebuilt release APK
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-release
          path: release

      - name: Collect and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          APK=$(find release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          [[ -n "$APKSIGNER" ]]
          "$APKSIGNER" verify --verbose "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          [[ -n "$AAPT2" ]]
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.srooyesh.seedcounter'"
          sha256sum "$APK" > release/SHA256SUMS.txt
          unzip -t "$APK" >/dev/null

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: seed-mas-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish-debug:
    name: Publish verified debug APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'debug' }}
    needs: [checks, connected-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download prebuilt debug APK
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-debug
          path: release

      - name: Collect and verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          APK=$(find release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -s "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          [[ -n "$AAPT2" ]]
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.srooyesh.seedcounter'"
          sha256sum "$APK" > release/SHA256SUMS.txt
          unzip -t "$APK" >/dev/null

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: seed-mas-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30
